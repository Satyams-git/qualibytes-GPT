# ============================================================
#  Qualibytes GPT — GitLab CI/CD Pipeline
#  File: .gitlab-ci.yml
#  Stages: build → push → deploy → verify
#
#  Runner: shell executor tagged `ec2` (README §8). It runs as the
#  non-root `gitlab-runner` user, so the jobs do NOT apt-get install —
#  openssh-client and curl must already be on the runner machine.
# ============================================================

stages:
  - build
  - push
  - deploy
  - verify

variables:
  FRONTEND_IMAGE: $DOCKER_USERNAME/qualibytes-frontend
  BACKEND_IMAGE:  $DOCKER_USERNAME/qualibytes-backend
  IMAGE_TAG:      $CI_PIPELINE_IID
  APP_DIR:        qualibytes-gpt
  SSH_OPTS:       "-o StrictHostKeyChecking=accept-new"

default:
  tags:
    - ec2

# Shared SSH setup for deploy + verify
.ssh-setup: &ssh-setup
  - eval "$(ssh-agent -s)"
  - printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh && chmod 700 ~/.ssh

# ── STAGE 1: BUILD ──────────────────────────────────────────
build-frontend:
  stage: build
  script:
    - docker build -t "$FRONTEND_IMAGE:$IMAGE_TAG" -t "$FRONTEND_IMAGE:latest" ./frontend

build-backend:
  stage: build
  script:
    - docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" -t "$BACKEND_IMAGE:latest" ./backend

# ── STAGE 2: PUSH ───────────────────────────────────────────
push-images:
  stage: push
  script:
    - printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - |
      for img in "$FRONTEND_IMAGE" "$BACKEND_IMAGE"; do
        docker push "$img:$IMAGE_TAG"
        docker push "$img:latest"
      done
  after_script:
    - docker logout || true

# ── STAGE 3: DEPLOY ─────────────────────────────────────────
deploy-to-ec2:
  stage: deploy
  before_script: *ssh-setup
  script:
    - ssh $SSH_OPTS "ubuntu@$APP_SERVER_IP" "mkdir -p ~/$APP_DIR"
    - scp $SSH_OPTS docker-compose.yml deploy.sh healthcheck.sh "ubuntu@$APP_SERVER_IP:~/$APP_DIR/"
    # Password goes over stdin — not in argv, env or logs
    - |
      printf '%s' "$DOCKER_PASSWORD" | ssh $SSH_OPTS "ubuntu@$APP_SERVER_IP" \
        "chmod +x ~/$APP_DIR/*.sh && DOCKER_USERNAME='$DOCKER_USERNAME' IMAGE_TAG='$IMAGE_TAG' ~/$APP_DIR/deploy.sh"
    - echo "Deployment done! URL: http://$APP_SERVER_IP"
  environment:
    name: production
    url: http://$APP_SERVER_IP
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── STAGE 4: VERIFY ─────────────────────────────────────────
health-check:
  stage: verify
  before_script: *ssh-setup
  script:
    - ssh $SSH_OPTS "ubuntu@$APP_SERVER_IP" "~/$APP_DIR/healthcheck.sh"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
